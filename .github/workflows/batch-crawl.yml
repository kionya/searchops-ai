name: batch-crawl

# 상시 워커 대신 크롤을 주기적으로 한 번씩 돌린다. 배포 플랫폼 없이 GitHub Actions 무료 러너만 쓴다.
# 크롤 → SeoIssue/WorkOrder 생성까지 한 프로세스에서 끝난다.
# 크롤 대상은 DB에 등록된 모든 Site 다.
# Redis 를 쓰지 않는다(apps/worker/src/batch-crawl.ts 주석 참고).
# 크롤 뒤에는 커넥터 동기화 → 키워드 검색량 → 옛 주소 점검(batch-redirect-check) 순으로 돈다.
#
# 필요한 secret:
#   DATABASE_URL, DIRECT_DATABASE_URL
#
# 커넥터(GSC/GA4) 동기화까지 하려면 추가로 (없으면 그 스텝만 건너뛴다):
#   SEARCHOPS_CREDENTIAL_STORAGE_MODE, SEARCHOPS_CREDENTIAL_ENCRYPTION_KEY(_ID)
#   SEARCHOPS_GOOGLE_OAUTH_CLIENT_ID, SEARCHOPS_GOOGLE_OAUTH_CLIENT_SECRET
#   선택: SEARCHOPS_BING_API_KEY, SEARCHOPS_PAGESPEED_API_KEY
#   선택(아침 요약): SEARCHOPS_TELEGRAM_BOT_TOKEN(기존 봇), SEARCHOPS_TELEGRAM_OWNER_CHAT_ID(원장님 1:1 채팅, 없으면 SEARCHOPS_TELEGRAM_PRODUCT_CHAT_ID)
#   repo 변수(선택): SEARCHOPS_WEB_BASE_URL — 요약 링크의 웹 주소(기본 https://searchops.totopapa.com)
#         이 둘은 사이트별 설정이 없다. 키를 넣으면 커넥터가 설정된 모든 사이트에
#         자동으로 붙는다(SiteConnector 행을 만들 필요 없다). 키가 없으면 그 provider
#         만 조용히 빠진다.
#
# 실패하면 "batch-crawl 실패" 이슈를 열고, 다음 성공에서 닫는다(맨 아래 스텝).
# 외부 알림 서비스도 새 시크릿도 쓰지 않는다.
#
# ⚠️ 이 워크플로가 아예 안 도는 경우는 스스로 알 수 없다. GitHub 은 60일간 레포 활동이
# 없으면 schedule 을 비활성화한다. 그건 외부 dead-man's switch 가 있어야 잡힌다.

on:
  schedule:
    # 정각은 GitHub 스케줄 혼잡으로 크게 밀린다(2026-11-17 03:00 예정이 10:11 에 돌아 낮 시간 사이트 지연에 걸림).
    - cron: "23 18 * * *" # UTC 18:23 = KST 03:23
  workflow_dispatch:
    inputs:
      max_pages:
        description: "사이트당 최대 크롤 페이지 수"
        required: false
        default: "25"

permissions:
  contents: read
  issues: write # 실패 알림용. 아래 Report batch status 스텝만 쓴다.

# 같은 사이트를 두 실행이 동시에 긁지 않게 한다. 진행 중인 크롤은 취소하지 않는다.
concurrency:
  group: batch-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 시크릿은 job 레벨에 두지 않는다. 여기 두면 pnpm install 의 서드파티 postinstall
    # 스크립트까지 운영 DB 자격증명을 상속한다. 실제로 쓰는 스텝에만 준다.

    steps:
      - name: Fail fast when secrets are missing
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          missing=""
          for v in DATABASE_URL; do
            [ -z "${!v:-}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::secret 미설정:$missing"
            echo "설정: gh secret set <NAME> --repo kionya/searchops-ai --body '<값>'"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 후행 "..." 로 워크스페이스 의존성(types, db, crawler-core 등)까지 함께 빌드한다.
      - name: Build worker and its dependencies
        run: pnpm --filter "@searchops/worker..." build

      - name: Run crawl batch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          SEARCHOPS_BATCH_MAX_PAGES: ${{ inputs.max_pages || '25' }}
          # 등록은 해두되 매일 긁지 않을 Site.id 를 쉼표로 나열한다. 없으면 전부 크롤한다.
          # 건너뛴 사이트는 로그에 이름이 찍힌다 — 조용히 빠지면 아무도 못 찾는다.
          SEARCHOPS_CRAWL_SKIP_SITE_IDS: ${{ secrets.SEARCHOPS_CRAWL_SKIP_SITE_IDS }}
        run: node apps/worker/dist/batch-crawl.js

      # 커넥터(GSC/GA4/Bing/PageSpeed) 동기화. API 는 "지금 동기화" 를 큐에 넣기만 하고,
      # 큐를 소비하는 워커를 상시 띄우지 않으므로 여기서 직접 돌린다.
      #
      # if: always() — 크롤이 실패해도 연동 데이터는 따로 들어와야 한다. 둘은 독립이다.
      #
      # 커넥터가 하나도 설정돼 있지 않으면 "할 일 없음" 을 찍고 0 으로 끝난다. 그래서
      # 연동을 아직 안 붙였어도 이 스텝이 배치를 빨갛게 만들지 않는다.
      - name: Run connector sync batch
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          # 연동 토큰이 이 키로 암호화돼 있다. 없으면 스텝이 즉시 종료 코드 2로 끊는다.
          SEARCHOPS_CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.SEARCHOPS_CREDENTIAL_ENCRYPTION_KEY }}
          SEARCHOPS_CREDENTIAL_ENCRYPTION_KEY_ID: ${{ secrets.SEARCHOPS_CREDENTIAL_ENCRYPTION_KEY_ID }}
          SEARCHOPS_CREDENTIAL_STORAGE_MODE: ${{ secrets.SEARCHOPS_CREDENTIAL_STORAGE_MODE }}
          # 만료된 access token 을 refresh 하려면 OAuth 클라이언트가 필요하다.
          SEARCHOPS_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.SEARCHOPS_GOOGLE_OAUTH_CLIENT_ID }}
          SEARCHOPS_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.SEARCHOPS_GOOGLE_OAUTH_CLIENT_SECRET }}
          SEARCHOPS_BING_API_KEY: ${{ secrets.SEARCHOPS_BING_API_KEY }}
          SEARCHOPS_PAGESPEED_API_KEY: ${{ secrets.SEARCHOPS_PAGESPEED_API_KEY }}
        run: |
          if [ -z "${SEARCHOPS_CREDENTIAL_STORAGE_MODE:-}" ]; then
            echo "커넥터 자격증명 secret 이 없어 동기화를 건너뛴다. 연동을 붙였다면 docs/API_DEPLOYMENT.md 를 보라."
            exit 0
          fi
          node apps/worker/dist/batch-connector-sync.js

      # T5 네이버 검색광고 월간 검색량. 키 3종이 없으면 스크립트가 스스로 건너뛴다(0 으로 종료).
      - name: Run keyword volume batch
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          SEARCHOPS_NAVER_SEARCHAD_CUSTOMER_ID: ${{ secrets.SEARCHOPS_NAVER_SEARCHAD_CUSTOMER_ID }}
          SEARCHOPS_NAVER_SEARCHAD_ACCESS_LICENSE: ${{ secrets.SEARCHOPS_NAVER_SEARCHAD_ACCESS_LICENSE }}
          SEARCHOPS_NAVER_SEARCHAD_SECRET_KEY: ${{ secrets.SEARCHOPS_NAVER_SEARCHAD_SECRET_KEY }}
        run: node apps/worker/dist/batch-keyword-volume.js

      # 리뉴얼 옛 주소 점검(단계 0) — 검색·방문 기록에 남은 옛 주소를 다시 열어 404 를 할 일로 만든다.
      # 응답 없는 주소가 절반을 넘으면 할 일을 바꾸지 않고 실패로 끝낸다(사이트 장애를 404 로 오인하지 않게).
      - name: Run legacy redirect check
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: node apps/worker/dist/batch-redirect-check.js

      # 원장님 텔레그램 아침 요약(설계 1d). 앞 단계가 실패해도 돈다 — 실패 사실도 요약에 한 줄 들어간다.
      # 알림 실패는 배치를 실패로 뒤집지 않는다. secret 이 없으면 스크립트가 스스로 건너뛴다.
      - name: Send daily digest
        if: always()
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          SEARCHOPS_TELEGRAM_BOT_TOKEN: ${{ secrets.SEARCHOPS_TELEGRAM_BOT_TOKEN }}
          # 원장님 1:1 id 가 없으면 기존 SearchOps 알림방으로 보낸다(2026-11-15 원장님 결정)
          SEARCHOPS_TELEGRAM_OWNER_CHAT_ID: ${{ secrets.SEARCHOPS_TELEGRAM_OWNER_CHAT_ID || secrets.SEARCHOPS_TELEGRAM_PRODUCT_CHAT_ID }}
          SEARCHOPS_WEB_BASE_URL: ${{ vars.SEARCHOPS_WEB_BASE_URL }}
          BATCH_STATUS: ${{ job.status }}
        run: node apps/worker/dist/batch-digest.js

      # Actions 기본 알림은 메일함에 묻힌다. 이슈는 열려 있는 동안 레포 상태로 남고
      # 댓글마다 다시 알림이 온다. 같은 제목의 열린 이슈에 댓글만 달아 매일 실패해도 쌓이지 않는다.
      # cancelled 는 실패가 아니므로 아무것도 하지 않는다.
      - name: Report batch status
        if: always()
        # ⚠️ 이 스텝은 잡을 실패시키면 안 된다. 2026-08-17 GitHub 장애 때 gh issue list 가
        # 503 을 받고 죽으면서, 크롤이 전부 성공한 실행을 실패로 뒤집었다(로그의
        # STATUS 는 success 였다). 알림 장치가 없는 장애를 만들어 낸 셈이다.
        # 보고에 실패하면 경고만 남기고 잡의 결론은 실제 작업 결과 그대로 둔다.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # gh 호출이 실패해도 여기서 멈추지 않는다. 알림을 못 보내는 것과
          # 배치가 실패한 것은 다른 일이고, 섞이면 원인을 못 찾는다.
          title="batch-crawl 실패"
          number="$(gh issue list --state open --search "$title in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty" 2>/dev/null || true)"
          if [ "$STATUS" = "success" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "복구됨: $RUN_URL" \
                || echo "::warning::이슈 #$number 를 닫지 못했다. 수동으로 닫아라."
            fi
          elif [ "$STATUS" = "failure" ]; then
            body="배치 실패. 로그: $RUN_URL — 크롤/커넥터 동기화 중 어느 하나만 실패해도 종료 코드가 1이다. 로그에서 '크롤 차단 의심' · '[batch-connector-sync]' 를 먼저 확인해라."
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "$body" \
                || echo "::warning::이슈 알림 실패. 배치는 실제로 실패했다: $RUN_URL"
            else
              gh issue create --title "$title" --body "$body" \
                || echo "::warning::이슈 생성 실패. 배치는 실제로 실패했다: $RUN_URL"
            fi
          fi
