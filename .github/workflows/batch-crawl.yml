name: batch-crawl

# 상시 워커 대신 크롤을 주기적으로 한 번씩 돌린다. 배포 플랫폼 없이 GitHub Actions 무료 러너만 쓴다.
# 크롤 → SeoIssue/WorkOrder 생성 → richdoc(리쥬엘) Supabase 적재까지 한 프로세스에서 끝난다.
# 크롤 대상은 DB에 등록된 모든 Site 다. SEARCHOPS_RICHDOC_SITE_IDS 는 적재 대상만 정한다.
# Redis 를 쓰지 않는다(apps/worker/src/batch-crawl.ts 주석 참고).
#
# 필요한 secret:
#   DATABASE_URL, DIRECT_DATABASE_URL
#   SEARCHOPS_RICHDOC_SUPABASE_URL, SEARCHOPS_RICHDOC_SUPABASE_SERVICE_ROLE_KEY, SEARCHOPS_RICHDOC_SITE_IDS
#
# 커넥터(GSC/GA4) 동기화까지 하려면 추가로 (없으면 그 스텝만 건너뛴다):
#   SEARCHOPS_CREDENTIAL_STORAGE_MODE, SEARCHOPS_CREDENTIAL_ENCRYPTION_KEY(_ID)
#   SEARCHOPS_GOOGLE_OAUTH_CLIENT_ID, SEARCHOPS_GOOGLE_OAUTH_CLIENT_SECRET
#   선택: SEARCHOPS_BING_API_KEY, SEARCHOPS_PAGESPEED_API_KEY
#
# 실패하면 "batch-crawl 실패" 이슈를 열고, 다음 성공에서 닫는다(맨 아래 스텝).
# 외부 알림 서비스도 새 시크릿도 쓰지 않는다.
#
# ⚠️ 이 워크플로가 아예 안 도는 경우는 스스로 알 수 없다. GitHub 은 60일간 레포 활동이
# 없으면 schedule 을 비활성화한다. 그건 외부 dead-man's switch 가 있어야 잡힌다.

on:
  schedule:
    - cron: "0 18 * * *" # UTC 18:00 = KST 03:00
  workflow_dispatch:
    inputs:
      max_pages:
        description: "사이트당 최대 크롤 페이지 수"
        required: false
        default: "25"

permissions:
  contents: read
  issues: write # 실패 알림용. 아래 Report batch status 스텝만 쓴다.

# 같은 사이트를 두 실행이 동시에 긁지 않게 한다. 진행 중인 크롤은 취소하지 않는다.
concurrency:
  group: batch-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 시크릿은 job 레벨에 두지 않는다. 여기 두면 pnpm install 의 서드파티 postinstall
    # 스크립트까지 운영 DB 자격증명과 service_role 키를 상속한다. 실제로 쓰는 스텝에만 준다.

    steps:
      - name: Fail fast when secrets are missing
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEARCHOPS_RICHDOC_SUPABASE_URL: ${{ secrets.SEARCHOPS_RICHDOC_SUPABASE_URL }}
          SEARCHOPS_RICHDOC_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SEARCHOPS_RICHDOC_SUPABASE_SERVICE_ROLE_KEY }}
          SEARCHOPS_RICHDOC_SITE_IDS: ${{ secrets.SEARCHOPS_RICHDOC_SITE_IDS }}
        run: |
          missing=""
          for v in DATABASE_URL SEARCHOPS_RICHDOC_SUPABASE_URL \
                   SEARCHOPS_RICHDOC_SUPABASE_SERVICE_ROLE_KEY SEARCHOPS_RICHDOC_SITE_IDS; do
            [ -z "${!v:-}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::secret 미설정:$missing"
            echo "설정: gh secret set <NAME> --repo kionya/searchops-ai --body '<값>'"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 후행 "..." 로 워크스페이스 의존성(types, db, crawler-core 등)까지 함께 빌드한다.
      - name: Build worker and its dependencies
        run: pnpm --filter "@searchops/worker..." build

      - name: Run crawl batch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          SEARCHOPS_RICHDOC_SUPABASE_URL: ${{ secrets.SEARCHOPS_RICHDOC_SUPABASE_URL }}
          SEARCHOPS_RICHDOC_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SEARCHOPS_RICHDOC_SUPABASE_SERVICE_ROLE_KEY }}
          SEARCHOPS_RICHDOC_SITE_IDS: ${{ secrets.SEARCHOPS_RICHDOC_SITE_IDS }}
          SEARCHOPS_BATCH_MAX_PAGES: ${{ inputs.max_pages || '25' }}
        run: node apps/worker/dist/batch-crawl.js

      # 커넥터(GSC/GA4/Bing/PageSpeed) 동기화. API 는 "지금 동기화" 를 큐에 넣기만 하고,
      # 큐를 소비하는 워커를 상시 띄우지 않으므로 여기서 직접 돌린다.
      #
      # if: always() — 크롤이 실패해도 연동 데이터는 따로 들어와야 한다. 둘은 독립이다.
      #
      # 커넥터가 하나도 설정돼 있지 않으면 "할 일 없음" 을 찍고 0 으로 끝난다. 그래서
      # 연동을 아직 안 붙였어도 이 스텝이 배치를 빨갛게 만들지 않는다.
      - name: Run connector sync batch
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          # 연동 토큰이 이 키로 암호화돼 있다. 없으면 스텝이 즉시 종료 코드 2로 끊는다.
          SEARCHOPS_CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.SEARCHOPS_CREDENTIAL_ENCRYPTION_KEY }}
          SEARCHOPS_CREDENTIAL_ENCRYPTION_KEY_ID: ${{ secrets.SEARCHOPS_CREDENTIAL_ENCRYPTION_KEY_ID }}
          SEARCHOPS_CREDENTIAL_STORAGE_MODE: ${{ secrets.SEARCHOPS_CREDENTIAL_STORAGE_MODE }}
          # 만료된 access token 을 refresh 하려면 OAuth 클라이언트가 필요하다.
          SEARCHOPS_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.SEARCHOPS_GOOGLE_OAUTH_CLIENT_ID }}
          SEARCHOPS_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.SEARCHOPS_GOOGLE_OAUTH_CLIENT_SECRET }}
          SEARCHOPS_BING_API_KEY: ${{ secrets.SEARCHOPS_BING_API_KEY }}
          SEARCHOPS_PAGESPEED_API_KEY: ${{ secrets.SEARCHOPS_PAGESPEED_API_KEY }}
        run: |
          if [ -z "${SEARCHOPS_CREDENTIAL_STORAGE_MODE:-}" ]; then
            echo "커넥터 자격증명 secret 이 없어 동기화를 건너뛴다. 연동을 붙였다면 docs/API_DEPLOYMENT.md 를 보라."
            exit 0
          fi
          node apps/worker/dist/batch-connector-sync.js

      # Actions 기본 알림은 메일함에 묻힌다. 이슈는 열려 있는 동안 레포 상태로 남고
      # 댓글마다 다시 알림이 온다. 같은 제목의 열린 이슈에 댓글만 달아 매일 실패해도 쌓이지 않는다.
      # cancelled 는 실패가 아니므로 아무것도 하지 않는다.
      - name: Report batch status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="batch-crawl 실패"
          number="$(gh issue list --state open --search "$title in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ "$STATUS" = "success" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "복구됨: $RUN_URL"
            fi
          elif [ "$STATUS" = "failure" ]; then
            body="배치 실패. 로그: $RUN_URL — 크롤/richdoc 적재/커넥터 동기화 중 어느 하나만 실패해도 종료 코드가 1이다. 로그에서 '적재 실패' 와 '[batch-connector-sync]' 를 먼저 확인해라."
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          fi
