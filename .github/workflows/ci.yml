name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  migration-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: searchops_ci
          POSTGRES_PASSWORD: searchops
          POSTGRES_USER: searchops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U searchops -d searchops_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://searchops:searchops@localhost:5432/searchops_ci?schema=public
      # CI postgres is a direct connection, so directUrl == url here.
      DIRECT_DATABASE_URL: postgresql://searchops:searchops@localhost:5432/searchops_ci?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @searchops/db db:generate

      - name: Deploy migrations
        run: pnpm db:migrate:deploy

      - name: Check migration status
        run: pnpm db:migrate:status

  # Multi-tenant credential 경로는 운영에서 실행되지 않는다(배치는 크롤만 한다).
  # 도달 불가라 조용히 썩는 걸 막으려고, 실행 주체를 흉내낸 검증기를 CI 에서 돌린다.
  # 유닛 테스트는 전부 인메모리 페이크라 실제 Postgres/마이그레이션/AES-GCM 을 못 본다.
  credential-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: searchops
          POSTGRES_USER: searchops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U searchops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # 검증기가 createdb/dropdb 로 자기 DB 를 만든다 — libpq 표준 변수로 붙인다.
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: searchops
      PGPASSWORD: searchops

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run credential smoke
        run: pnpm smoke:credential

      # 웹이 API 없이 실데이터를 그리는 경로. 테넌트 스코프와 최소권한 역할까지
      # 진짜 Postgres 위에서 확인한다 — 여기가 뚫리면 남의 조직 데이터가 보인다.
      - name: Run web direct-database smoke
        run: pnpm smoke:web-db

  # API 컨테이너가 실제로 빌드되는지 본다. Dockerfile 은 배포 직전에야 쓰이는 물건이라,
  # 여기서 안 돌리면 "배포하려는 순간" 처음 깨진다 — 가장 급할 때 가장 모르는 상태가 된다.
  # 이미지를 푸시하지는 않는다. 빌드가 통과하는지만 확인한다.
  api-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t searchops-api:ci .

      # 부팅까지 확인한다. 빌드만 되고 시작에서 죽는 경우를 잡는다 — env 가 없으면
      # parseSearchOpsEnv 가 즉시 던지므로, 그 오류가 나오면 이미지 자체는 정상이다.
      - name: Boot check
        run: |
          set +e
          output=$(docker run --rm searchops-api:ci 2>&1)
          status=$?
          echo "$output"
          if [ $status -eq 0 ]; then
            echo "::error::env 없이 종료 코드 0 이 나왔다. 환경변수 검증이 동작하지 않는다."
            exit 1
          fi
          if echo "$output" | grep -qiE "DATABASE_URL|REDIS_URL"; then
            echo "이미지 정상: 누락된 env 를 보고하고 종료했다."
            exit 0
          fi
          echo "::error::기대한 env 검증 오류가 아니다. 이미지가 부팅 전에 깨졌을 수 있다."
          exit 1
