name: ops-heartbeat

# 운영 API(Render) 가동 감지. GET /health 가 200 이 아니면 실패 → GitHub 실패 알림 메일.
#
# 2026-11-11: 예전 2단계(HS256 토큰으로 /ops/metrics-export 호출)는 뺐다. Render API 는
# SEARCHOPS_IDP_JWKS_JSON(Supabase) 로 검증해 HS256 토큰을 받지 않으므로 매번 401 이었고,
# 알림 웹훅(SEARCHOPS_OBSERVABILITY_ALERT_WEBHOOK_URL)도 설정돼 있지 않아 구동할 대상이 없다.
# 웹훅을 붙이면 JWKS 로 통과하는 토큰 경로와 함께 되살려라(git 기록에 원본이 있다).
# 주의: schedule 워크플로는 기본 브랜치(main)에서만 동작하며, GitHub 부하에 따라
#       수 분 지연될 수 있고 60일 무활동 시 비활성화될 수 있음.

on:
  schedule:
    - cron: "*/5 * * * *" # 5분마다 (GitHub Actions 최소 권장 간격)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ops-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    env:
      # 배포 대상 URL(현재 https://searchops-api.onrender.com). 호스트를 옮길 수 있어 하드코딩하지 않는다.
      #   gh variable set SEARCHOPS_API_BASE --repo kionya/searchops-ai --body 'https://<host>'
      # 미설정이면 배포 전으로 보고 조용히 건너뛴다(죽은 URL 을 5분마다 두드리지 않기 위해).
      API_BASE: ${{ vars.SEARCHOPS_API_BASE }}
    steps:
      - name: Probe /health (liveness)
        run: |
          set -euo pipefail

          if [ -z "${API_BASE:-}" ]; then
            echo "::warning::SEARCHOPS_API_BASE repo variable 미설정 — 배포 전/이전 중으로 보고 건너뛴다."
            exit 0
          fi

          # Render 무료 플랜은 유휴 15분 뒤 잠들고, 깨어나는 데 30~60초 걸린다(실측 30초+).
          # 예약 실행은 GitHub 사정으로 몇 시간씩 벌어져 대부분 콜드스타트를 맞으므로
          # 90초 기다리고 한 번 더 시도한다. 그래도 200 이 아니면 진짜 장애로 본다.
          for attempt in 1 2; do
            h=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$API_BASE/health" || echo "000")
            echo "attempt=$attempt health=$h"
            if [ "$h" = "200" ]; then
              echo "ops-heartbeat ok"
              exit 0
            fi
            sleep 10
          done
          echo "::error::API /health 비정상 (got $h) — 프로세스 다운/네트워크 장애 의심"
          exit 1
