name: api-image

# API 이미지를 GitHub Actions 에서 굽고 GHCR 에 올린다. Render 는 받아서 띄우기만 한다.
#
# 왜 여기서 굽나: Render 무료 플랜의 빌드 자원으로는 이 모노레포 빌드(pnpm install +
# tsc + prisma generate)가 메모리 부족으로 죽는다. 같은 이미지를 GitHub 러너는 4분 안에
# 굽는다. 빌드를 여기로 옮기면 무료 플랜을 유지하면서 배포도 빨라진다.
#
# ⚠️ 이미지 태그가 갱신돼도 Render 는 **자동으로 재배포하지 않는다**(공식 문서).
# 그래서 마지막에 deploy hook 을 직접 부른다. imgURL 로 커밋 SHA 태그를 지정해
# "방금 만든 그 이미지" 가 뜨도록 못 박는다 — latest 로 두면 경합에서 다른 이미지가 뜬다.
#
# 필요한 secret: RENDER_DEPLOY_HOOK_URL (Render → 서비스 → Settings → Deploy Hook)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: api-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/searchops-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR 푸시. main 에서만 실제로 쓴다.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # PR 에서는 로그인하지 않는다. 포크 PR 은 packages: write 를 받지 못해 실패한다.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main 이 아니면 굽기만 하고 버린다(빌드가 깨졌는지는 PR 에서도 알아야 한다).
      # 레이어 캐시를 Actions 캐시에 둬서 두 번째부터는 몇 분이 몇십 초가 된다.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          load: ${{ github.ref != 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 빌드만 되고 시작에서 죽는 경우를 잡는다. env 가 없으면 parseSearchOpsEnv 가
      # 즉시 던지므로, 그 오류가 나오면 이미지 자체는 정상이라는 뜻이다.
      - name: Boot check
        run: |
          set +e
          output=$(docker run --rm "$IMAGE:${{ github.sha }}" 2>&1)
          status=$?
          echo "$output"
          if [ $status -eq 0 ]; then
            echo "::error::env 없이 종료 코드 0 이 나왔다. 환경변수 검증이 동작하지 않는다."
            exit 1
          fi
          if echo "$output" | grep -qiE "DATABASE_URL|REDIS_URL"; then
            echo "이미지 정상: 누락된 env 를 보고하고 종료했다."
            exit 0
          fi
          echo "::error::기대한 env 검증 오류가 아니다. 이미지가 부팅 전에 깨졌을 수 있다."
          exit 1

      # 부팅 확인까지 통과한 이미지만 배포한다.
      - name: Trigger Render deploy
        if: github.ref == 'refs/heads/main'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${HOOK:-}" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL 이 없어 배포를 건너뛴다. 이미지는 올라갔다."
            exit 0
          fi
          # imgURL 로 방금 만든 SHA 태그를 못 박는다. 200 이 아니면 실패로 끊는다.
          code=$(curl -sS -o /dev/stderr -w "%{http_code}" \
            --get --data-urlencode "imgURL=$IMAGE:${{ github.sha }}" "$HOOK")
          echo "deploy hook -> HTTP $code"
          [ "$code" = "200" ]
