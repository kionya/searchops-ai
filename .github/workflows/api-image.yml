name: api-image

# API 이미지를 GitHub Actions 에서 굽고 GHCR 에 올린다. Render 는 받아서 띄우기만 한다.
#
# 왜 여기서 굽나: Render 무료 플랜의 빌드 자원으로는 이 모노레포 빌드(pnpm install +
# tsc + prisma generate)가 메모리 부족으로 죽는다. 같은 이미지를 GitHub 러너는 4분 안에
# 굽는다. 빌드를 여기로 옮기면 무료 플랜을 유지하면서 배포도 빨라진다.
#
# ⚠️ 이미지 태그가 갱신돼도 Render 는 **자동으로 재배포하지 않는다**(공식 문서).
# 그래서 마지막에 deploy hook 을 직접 부른다. imgURL 로 커밋 SHA 태그를 지정해
# "방금 만든 그 이미지" 가 뜨도록 못 박는다 — latest 로 두면 경합에서 다른 이미지가 뜬다.
#
# ⚠️ 마켓플레이스 액션(docker/build-push-action 등)을 쓰지 않는다. GitHub 장애 때
# codeload 에서 액션을 못 받아 워크플로가 통째로 실패했다 — 정작 배포가 급한 순간에.
# docker CLI 는 러너에 이미 깔려 있으므로 받아올 것이 없다.
#
# 필요한 secret: RENDER_DEPLOY_HOOK_URL (Render → 서비스 → Settings → Deploy Hook)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: api-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/searchops-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR 푸시. main 에서만 실제로 쓴다.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ponytail: 레이어 캐시를 쓰지 않아 매번 처음부터 굽는다(약 4분). 배포 파이프라인이라
      # 그 정도는 감당된다. 더 빨라져야 하면 buildx 의 registry 캐시를 붙여라 —
      # 다만 캐시 export 는 docker-container 드라이버가 필요해 설정이 한 겹 늘어난다.
      - name: Build image
        run: docker build -f apps/api/Dockerfile -t "$IMAGE:$GITHUB_SHA" .

      # 빌드만 되고 시작에서 죽는 경우를 잡는다. env 가 없으면 parseSearchOpsEnv 가
      # 즉시 던지므로, 그 오류가 나오면 이미지 자체는 정상이라는 뜻이다.
      # 푸시보다 먼저 한다 — 순서를 바꾸면 깨진 이미지가 먼저 나간다.
      - name: Boot check
        run: |
          set +e
          output=$(docker run --rm "$IMAGE:$GITHUB_SHA" 2>&1)
          status=$?
          echo "$output"
          if [ $status -eq 0 ]; then
            echo "::error::env 없이 종료 코드 0 이 나왔다. 환경변수 검증이 동작하지 않는다."
            exit 1
          fi
          if echo "$output" | grep -qiE "DATABASE_URL|REDIS_URL"; then
            echo "이미지 정상: 누락된 env 를 보고하고 종료했다."
            exit 0
          fi
          echo "::error::기대한 env 검증 오류가 아니다. 이미지가 부팅 전에 깨졌을 수 있다."
          exit 1

      # PR 에서는 여기서 끝난다. 굽는 것까지만 확인하고 푸시하지 않는다 —
      # 포크 PR 은 packages: write 를 받지 못해 로그인 자체가 실패한다.
      - name: Push to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: Trigger Render deploy
        if: github.ref == 'refs/heads/main'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${HOOK:-}" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL 이 없어 배포를 건너뛴다. 이미지는 올라갔다."
            exit 0
          fi
          # imgURL 로 방금 만든 SHA 태그를 못 박는다. 200 이 아니면 실패로 끊는다.
          code=$(curl -sS -o /dev/stderr -w "%{http_code}" \
            --get --data-urlencode "imgURL=$IMAGE:$GITHUB_SHA" "$HOOK")
          echo "deploy hook -> HTTP $code"
          [ "$code" = "200" ]
